<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A 2D map that connects everything noteworthy or famous on the internet, ordered by year."
    />
    <title>Internet Lore</title>
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <header id="toolbar">
      <h1>Internet Lore</h1>
      <div id="search-box">
        <input id="search" type="search" placeholder="Search title, description or tag..." autocomplete="off" />
        <ul id="results" hidden></ul>
      </div>
      <div id="tags" aria-label="Filter by tag"></div>
      <button id="fit" type="button" title="Show the whole map">Fit</button>
    </header>
    <main id="stage">
      <div id="axis" aria-hidden="true"></div>
      <div id="cy"></div>
      <div id="tooltip" hidden></div>
      <aside id="details" hidden></aside>
      <p id="empty" hidden></p>
    </main>
  </body>
</html>
